name: 部署文档
on:
  push:
    branches:
      - main
  workflow_dispatch: # 支持手动触发
permissions:
  contents: write
jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3        # ✅ 修改：与本地版本保持一致，避免 packages 字段报错

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm            # ✅ 恢复缓存，加速 CI（pnpm 已在上一步装好）

      - name: 安装依赖
        run: pnpm install

      - name: 构建文档
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          pnpm run docs:build
          touch docs/.vuepress/dist/.nojekyll

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/.vuepress/dist